# Fly.io deployment. Run:  fly launch --no-deploy  then  fly deploy
app = "campustrace"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_PATH = "/data/campustrace.sqlite3"
  PROFILE_BUDGET_SECONDS = "21"

[http_service]
  internal_port = 8000
  force_https = true
  # The judges may open the link cold; keeping one machine alive avoids a
  # first-request cold start on top of the 30-second search budget.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[mounts]]
  source = "campustrace_data"
  destination = "/data"
